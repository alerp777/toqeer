name: Android APK Build

on:
  push:
    tags:
      - "v*"           # trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:   # also allow manual runs from GitHub Actions UI
    inputs:
      app:
        description: "Which app to build"
        required: true
        default: "both"
        type: choice
        options: [rider, vendor, both]

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  # ── Rider APK ─────────────────────────────────────────────────────────────
  build-rider:
    name: Build AJKMart Rider APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.app == 'rider' || github.event.inputs.app == 'both' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android icon & splash assets
        run: node scripts/generate-android-icons.mjs

      - name: Build web assets (Capacitor mode)
        working-directory: artifacts/rider-app
        env:
          VITE_API_BASE_URL: ${{ secrets.RIDER_VITE_API_BASE_URL }}
          VITE_CAPACITOR: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.RIDER_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.RIDER_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.RIDER_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.RIDER_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.RIDER_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.RIDER_FIREBASE_APP_ID }}
        run: pnpm run build:cap

      - name: Sync Capacitor assets to Android
        working-directory: artifacts/rider-app
        run: npx cap sync android

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.RIDER_KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/rider-app/android/app/rider.jks

      - name: Build release APK
        working-directory: artifacts/rider-app/android
        env:
          RIDER_KEYSTORE_PATH: ${{ github.workspace }}/artifacts/rider-app/android/app/rider.jks
          RIDER_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDER_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          RIDER_KEY_PASSWORD: ${{ secrets.RIDER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Rider APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajkmart-rider-${{ github.ref_name }}.apk
          path: artifacts/rider-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # ── Vendor APK ────────────────────────────────────────────────────────────
  build-vendor:
    name: Build AJKMart Vendor APK
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.app == 'vendor' || github.event.inputs.app == 'both' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android icon & splash assets
        run: node scripts/generate-android-icons.mjs

      - name: Build web assets (Capacitor mode)
        working-directory: artifacts/vendor-app
        env:
          VITE_API_BASE_URL: ${{ secrets.VENDOR_VITE_API_BASE_URL }}
          VITE_CAPACITOR: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.VENDOR_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VENDOR_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VENDOR_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VENDOR_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VENDOR_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VENDOR_FIREBASE_APP_ID }}
        run: pnpm run build:cap

      - name: Sync Capacitor assets to Android
        working-directory: artifacts/vendor-app
        run: npx cap sync android

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.VENDOR_KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/vendor-app/android/app/vendor.jks

      - name: Build release APK
        working-directory: artifacts/vendor-app/android
        env:
          VENDOR_KEYSTORE_PATH: ${{ github.workspace }}/artifacts/vendor-app/android/app/vendor.jks
          VENDOR_KEYSTORE_PASSWORD: ${{ secrets.VENDOR_KEYSTORE_PASSWORD }}
          VENDOR_KEY_ALIAS: ${{ secrets.VENDOR_KEY_ALIAS }}
          VENDOR_KEY_PASSWORD: ${{ secrets.VENDOR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Vendor APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajkmart-vendor-${{ github.ref_name }}.apk
          path: artifacts/vendor-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
